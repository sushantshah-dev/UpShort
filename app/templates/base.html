<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}URL Dashboard{% endblock %}</title>
</head>
<body>
  <header>
    <strong>Vybe URL Shortener</strong>
    <nav>
      {% if session.get('user_id') %}
        <a href="{{ url_for('shortener.dashboard') }}">Dashboard</a>
        <form action="{{ url_for('shortener.logout') }}" method="post">
          <button type="submit">Logout</button>
        </form>
      {% else %}
        <a href="{{ url_for('shortener.login') }}">Login</a>
        <a href="{{ url_for('shortener.register') }}">Register</a>
      {% endif %}
    </nav>
  </header>

  <main>
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, message in messages %}
        <p>[{{ category }}] {{ message }}</p>
      {% endfor %}
    {% endwith %}

    {% block content %}{% endblock %}
  </main>
</body>
</html>
